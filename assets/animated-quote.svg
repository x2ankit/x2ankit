<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="76" viewBox="0 0 1000 76" role="img" aria-labelledby="title desc">
  <title id="title">Engineering philosophy</title>
  <desc id="desc">I’m less interested in building another demo and more interested in understanding what it takes to make intelligent systems reliable.</desc>
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="35%" stop-color="#a78bfa"/>
      <stop offset="70%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#60a5fa"/>
      <animate attributeName="x1" values="-100%;100%;-100%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%;0%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <text x="500" y="30" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="currentColor">
    <tspan>“I’m less interested in building another demo and more interested in</tspan>
  </text>
  <text x="500" y="61" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="url(#textGradient)">
    understanding what it takes to make intelligent systems reliable.”
  </text>
</svg>